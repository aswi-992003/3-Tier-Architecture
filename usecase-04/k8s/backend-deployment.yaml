apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-backend
  namespace: claims-k8s-lab
  labels:
    app: claims-backend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: claims-backend

  template:
    metadata:
      labels:
        app: claims-backend

    spec:
      imagePullSecrets:
        - name: harbor-pull-secret

      containers:
        - name: backend
          image: host.docker.internal:8082/claims/claims-backend@sha256:f409b2349c6d3f2a1151e4a5245e58c8aac5ac3d66de3d4884424b0f5f2a0d36
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5001

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: claims-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: claims-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: claims-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: claims-config
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claims-db-secret
                  key: password

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
