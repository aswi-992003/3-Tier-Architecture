services:

  database:
    image: postgres:16
    container_name: claims-db

    environment:
      POSTGRES_DB: claimsdb
      POSTGRES_USER: claimsuser
      POSTGRES_PASSWORD: claimspassword

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimsuser -d claimsdb"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: claims-backend

    environment:
      DB_HOST: database
      DB_NAME: claimsdb
      DB_USER: claimsuser
      DB_PASSWORD: claimspassword
      DB_PORT: 5432

    ports:
      - "5001:5001"

    depends_on:
      database:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: claims-frontend

    ports:
      - "8081:8080"

    depends_on:
      - backend


volumes:
  postgres_data: