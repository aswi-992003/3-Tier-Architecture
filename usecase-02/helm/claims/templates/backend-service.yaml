apiVersion: v1
kind: Service
metadata:
  name: claims-backend
  labels:
    app: claims-backend
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  type: ClusterIP
  selector:
    app: claims-backend
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
