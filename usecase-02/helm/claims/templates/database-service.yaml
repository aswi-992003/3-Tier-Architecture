apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.database.host | quote }}
  labels:
    app: claims-db
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  type: ClusterIP
  selector:
    app: claims-db
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
      protocol: TCP
