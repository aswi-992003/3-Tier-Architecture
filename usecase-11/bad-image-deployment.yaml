apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-frontend-usecase11
  namespace: claims-k8s-lab
  labels:
    app: claims-frontend-usecase11
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-frontend-usecase11
  template:
    metadata:
      labels:
        app: claims-frontend-usecase11
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: frontend
          image: host.docker.internal:8082/claims/claims-frontend:usecase-11-missing
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
