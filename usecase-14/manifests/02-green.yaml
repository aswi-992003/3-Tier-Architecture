apiVersion: v1
kind: ConfigMap
metadata:
  name: usecase14-green-content
  namespace: claims-k8s-lab
  labels:
    app: usecase14-demo
    version: green
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Use Case 14 - Green</title>
    </head>
    <body>
      <h1>GREEN Version 2</h1>
      <p>New release candidate</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase14-green
  namespace: claims-k8s-lab
  labels:
    app: usecase14-demo
    version: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usecase14-demo
      version: green
  template:
    metadata:
      labels:
        app: usecase14-demo
        version: green
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: web-content
          configMap:
            name: usecase14-green-content
