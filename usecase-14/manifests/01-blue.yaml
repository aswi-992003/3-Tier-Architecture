apiVersion: v1
kind: ConfigMap
metadata:
  name: usecase14-blue-content
  namespace: claims-k8s-lab
  labels:
    app: usecase14-demo
    version: blue
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Use Case 14 - Blue</title>
    </head>
    <body>
      <h1>BLUE Version 1</h1>
      <p>Stable release</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase14-blue
  namespace: claims-k8s-lab
  labels:
    app: usecase14-demo
    version: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usecase14-demo
      version: blue
  template:
    metadata:
      labels:
        app: usecase14-demo
        version: blue
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: web-content
          configMap:
            name: usecase14-blue-content
---
apiVersion: v1
kind: Service
metadata:
  name: usecase14-service
  namespace: claims-k8s-lab
  labels:
    app: usecase14-demo
spec:
  selector:
    app: usecase14-demo
    version: blue
  ports:
    - name: http
      port: 80
      targetPort: 80
