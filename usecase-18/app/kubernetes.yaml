apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase18-demo
  namespace: claims-logging-lab
  labels:
    app: usecase18-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usecase18-demo
  template:
    metadata:
      labels:
        app: usecase18-demo
        service: usecase18-demo
        environment: lab
        version: v1
    spec:
      containers:
        - name: application
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/app.py
          env:
            - name: SERVICE_NAME
              value: usecase18-demo
            - name: APP_ENVIRONMENT
              value: lab
            - name: APP_VERSION
              value: v1
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: application-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: application-code
          configMap:
            name: usecase18-app
---
apiVersion: v1
kind: Service
metadata:
  name: usecase18-demo
  namespace: claims-logging-lab
spec:
  selector:
    app: usecase18-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
