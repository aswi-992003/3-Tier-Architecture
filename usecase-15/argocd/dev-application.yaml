apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: usecase15-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://gitlab.com/midh-technologies-group1/3-tier-architecture.git
    targetRevision: feature/usecase-15
    path: usecase-15/chart
    helm:
      releaseName: usecase15-demo
      valueFiles:
        - ../values/values-common.yaml
        - ../values/values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: claims-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
