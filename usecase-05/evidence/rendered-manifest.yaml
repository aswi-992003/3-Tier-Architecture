---
# Source: claims/templates/backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-backend
  labels:
    app: claims-backend
    app.kubernetes.io/instance: "claims"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-backend
      app.kubernetes.io/instance: "claims"
  template:
    metadata:
      labels:
        app: claims-backend
        app.kubernetes.io/instance: "claims"
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: backend
          image: "host.docker.internal:8082/claims/claims-backend@sha256:f409b2349c6d3f2a1151e4a5245e58c8aac5ac3d66de3d4884424b0f5f2a0d36"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: DB_HOST
              value: "claims-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "claimsdb"
            - name: DB_USER
              value: "claimsuser"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "claims-db-secret"
                  key: password
          readinessProbe:
            httpGet:
              path: "/api/health"
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

---
# Source: claims/templates/database-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claims-db
      app.kubernetes.io/instance: "claims"
  template:
    metadata:
      labels:
        app: claims-db
        app.kubernetes.io/instance: "claims"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "claimsdb"
            - name: POSTGRES_USER
              value: "claimsuser"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "claims-db-secret"
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "100Mi"
            limits:
              memory: "512Mi"
              ephemeral-storage: "1Gi"
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/postgresql/data
            - name: database-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: database-data
          persistentVolumeClaim:
            claimName: claims-db-data
        - name: database-init
          configMap:
            name: claims-db-init
